# cargo-deny configuration (supply-chain gate, ADR-0003).
# Licences: permissive only. Copyleft licences require an explicit, documented exception.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# ACCEPTED EXCEPTION (pending approval in PHASE-01-COMPLETION.md, action A-10):
# RUSTSEC-2026-0459 / CVE-2026-119375 – bundled SQLite < 3.54 can return uninitialised
# page-cache memory when opening a crafted database + sibling -wal file. sqlx-sqlite 0.9.0
# caps libsqlite3-sys < 0.38, so the patched 0.39 cannot be selected yet. Local attack
# vector only; EAEH's data directory is created 0700 and the database file is 0600.
# Remove this entry as soon as sqlx allows libsqlite3-sys >= 0.39.
ignore = [
  { id = "RUSTSEC-2026-0459", reason = "No sqlx release supports patched libsqlite3-sys >= 0.39 yet; local-only vector mitigated by 0700/0600 permissions; tracked as A-10" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MIT-0",
  # Mozilla CA certificate data (webpki-root-certs via rustls-platform-verifier); permissive data licence (ADR-0015)
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
